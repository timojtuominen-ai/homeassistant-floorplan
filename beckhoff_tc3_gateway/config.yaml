name: "Beckhoff TC3 Gateway TEST"
version: "0.1.4"
slug: "beckhoff_tc3_gateway"
description: "TwinCAT 3 / CX9240 ADS <-> MQTT Discovery gateway for Kotiautomaatio_TC3 v0.22"
url: "https://github.com/timojtuominen-ai/homeassistant-floorplan"
startup: application
boot: auto
init: false
stage: experimental
arch:
  - aarch64
host_network: true
services:
  - mqtt:need

options:
  plc_ip: "192.168.1.171"
  plc_ams_net_id: "5.179.194.231.1.1"
  local_ams_net_id: "192.168.1.57.1.1"
  plc_ads_port: 851
  poll_interval: 1.0
  reconnect_delay: 5
  command_pulse_ms: 200
  test_mode: true
  publish_discovery: true
  log_level: "INFO"

schema:
  plc_ip: str
  plc_ams_net_id: str
  local_ams_net_id: str
  plc_ads_port: int(1,65535)
  poll_interval: float(0.2,60)
  reconnect_delay: int(1,300)
  command_pulse_ms: int(50,2000)
  test_mode: bool
  publish_discovery: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)
