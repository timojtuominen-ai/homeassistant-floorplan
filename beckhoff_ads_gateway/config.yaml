name: "Beckhoff ADS Gateway"
version: "0.3.2"
slug: "beckhoff_ads_gateway"
description: "Reads a TwinCAT 2 ADS symbol and publishes it using MQTT Discovery."
url: "https://github.com/timojtuominen-ai/homeassistant-floorplan"
startup: application
boot: auto
init: false
stage: experimental
arch:
  - aarch64
host_network: true
services:
  - mqtt:need
options:
  plc_ip: "192.168.1.5"
  plc_ams_net_id: "5.14.33.10.1.1"
  local_ams_net_id: "192.168.1.57.1.1"
  plc_ads_port: 801
  poll_interval: 5
  symbol: ".arrHVACStates[4].lrActualValue"
  data_type: "LREAL"
  entity_name: "Olohuone lämpötila"
  entity_id: "olohuone_lampotila"
  unit_of_measurement: "°C"
  device_class: "temperature"
  state_class: "measurement"
  log_level: "DEBUG"
schema:
  plc_ip: str
  plc_ams_net_id: str
  local_ams_net_id: str
  plc_ads_port: int(1,65535)
  poll_interval: int(1,300)
  symbol: str
  data_type: list(BOOL|BYTE|WORD|DWORD|INT|UINT|DINT|UDINT|REAL|LREAL)
  entity_name: str
  entity_id: match(^[a-z0-9_]+$)
  unit_of_measurement: str
  device_class: str
  state_class: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
