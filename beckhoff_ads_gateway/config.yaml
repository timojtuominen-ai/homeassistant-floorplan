name: "Beckhoff ADS Gateway"
version: "1.4.0"
slug: "beckhoff_ads_gateway"
description: "TwinCAT 2 / TcBA gateway for Home Assistant: room temperatures and lighting control via ADS + MQTT Discovery."
url: "https://github.com/timojtuominen-ai/homeassistant-floorplan"
startup: application
boot: auto
init: false
stage: experimental
arch:
  - aarch64
host_network: true
services:
  - mqtt:need

options:
  plc_ip: "192.168.1.5"
  plc_ams_net_id: "5.14.33.10.1.1"
  local_ams_net_id: "192.168.1.57.1.1"
  plc_ads_port: 801
  poll_interval: 30
  light_poll_interval: 1
  reconnect_delay: 30
  publish_heartbeat: 600
  add_local_route: true

  sensors_json: >-
    [{"id":"olohuone_lampotila","name":"Olohuone lämpötila","symbol":".arrHVACStates[4].lrActualValue","type":"LREAL","unit":"°C","device_class":"temperature","state_class":"measurement","precision":1},{"id":"keittio_lampotila","name":"Keittiö lämpötila","symbol":".arrHVACStates[7].lrActualValue","type":"LREAL","unit":"°C","device_class":"temperature","state_class":"measurement","precision":1},{"id":"lt_mh_lampotila","name":"L&T MH lämpötila","symbol":".arrHVACStates[5].lrActualValue","type":"LREAL","unit":"°C","device_class":"temperature","state_class":"measurement","precision":1},{"id":"allun_mh_lampotila","name":"Allun MH lämpötila","symbol":".arrHVACStates[2].lrActualValue","type":"LREAL","unit":"°C","device_class":"temperature","state_class":"measurement","precision":1},{"id":"emman_mh_lampotila","name":"Emman MH lämpötila","symbol":".arrHVACStates[3].lrActualValue","type":"LREAL","unit":"°C","device_class":"temperature","state_class":"measurement","precision":1}]

  lights_json: >-
    [{"id":"oh_kulku_spotit","name":"OH kulku spotit","room":"olohuone","command_on_symbol":".arrLampCommands[20].bOn","command_off_symbol":".arrLampCommands[20].bOff","state_symbol":".arrLampProcessOutputData[20].bData","pulse_ms":200},{"id":"oh_pihan_puolen_valot","name":"OH pihan puolen valot","room":"olohuone","command_on_symbol":".arrLampCommands[21].bOn","command_off_symbol":".arrLampCommands[21].bOff","state_symbol":".arrLampProcessOutputData[21].bData","pulse_ms":200},{"id":"oh_terassin_puolen_valot","name":"OH terassin puolen valot","room":"olohuone","command_on_symbol":".arrLampCommands[22].bOn","command_off_symbol":".arrLampCommands[22].bOff","state_symbol":".arrLampProcessOutputData[22].bData","pulse_ms":200},{"id":"oh_keskivalo","name":"OH keskivalo","room":"olohuone","command_on_symbol":".arrLampCommands[23].bOn","command_off_symbol":".arrLampCommands[23].bOff","state_symbol":".arrLampProcessOutputData[23].bData","pulse_ms":200},{"id":"oh_epasuora_pihanseina","name":"OH epäsuora pihanseinä","room":"olohuone","command_on_symbol":".arrLampCommands[24].bOn","command_off_symbol":".arrLampCommands[24].bOff","state_symbol":".arrLampProcessOutputData[24].bData","pulse_ms":200},{"id":"oh_epasuora_paatyseina","name":"OH epäsuora päätyseinä","room":"olohuone","command_on_symbol":".arrLampCommands[25].bOn","command_off_symbol":".arrLampCommands[25].bOff","state_symbol":".arrLampProcessOutputData[25].bData","pulse_ms":200},{"id":"oh_epasuora_terassinseina","name":"OH epäsuora terassinseinä","room":"olohuone","command_on_symbol":".arrLampCommands[26].bOn","command_off_symbol":".arrLampCommands[26].bOff","state_symbol":".arrLampProcessOutputData[26].bData","pulse_ms":200},{"id":"oh_porrasaukko_valo","name":"OH porrasaukko valo","room":"olohuone","command_on_symbol":".arrLampCommands[27].bOn","command_off_symbol":".arrLampCommands[27].bOff","state_symbol":".arrLampProcessOutputData[27].bData","pulse_ms":200},{"id":"keittio_valitila_valo","name":"Keittiön välitila valo","room":"keittio","command_on_symbol":".arrLampCommands[31].bOn","command_off_symbol":".arrLampCommands[31].bOff","state_symbol":".arrLampProcessOutputData[31].bData","pulse_ms":200},{"id":"keittio_valo","name":"Keittiön valo","room":"keittio","command_on_symbol":".arrLampCommands[32].bOn","command_off_symbol":".arrLampCommands[32].bOff","state_symbol":".arrLampProcessOutputData[32].bData","pulse_ms":200},{"id":"ruokatila_valo","name":"Ruokatilan valo","room":"keittio","command_on_symbol":".arrLampCommands[33].bOn","command_off_symbol":".arrLampCommands[33].bOff","state_symbol":".arrLampProcessOutputData[33].bData","pulse_ms":200},{"id":"keittio_ruokatila_kaytava","name":"Keittiö/ruokatila käytävä","room":"keittio","command_on_symbol":".arrLampCommands[34].bOn","command_off_symbol":".arrLampCommands[34].bOff","state_symbol":".arrLampProcessOutputData[34].bData","pulse_ms":200},{"id":"lt_vaatehuonevalot","name":"L&T vaatehuonevalot","room":"lt_mh","command_on_symbol":".arrLampCommands[10].bOn","command_off_symbol":".arrLampCommands[10].bOff","state_symbol":".arrLampProcessOutputData[10].bData","pulse_ms":200},{"id":"lt_spotit","name":"L&T spotit","room":"lt_mh","command_on_symbol":".arrLampCommands[12].bOn","command_off_symbol":".arrLampCommands[12].bOff","state_symbol":".arrLampProcessOutputData[12].bData","pulse_ms":200},{"id":"lt_epasuora_valo","name":"L&T epäsuora valo","room":"lt_mh","command_on_symbol":".arrLampCommands[19].bOn","command_off_symbol":".arrLampCommands[19].bOff","state_symbol":".arrLampProcessOutputData[19].bData","pulse_ms":200},{"id":"allun_spotit","name":"Allun MH spotit","room":"allun_mh","command_on_symbol":".arrLampCommands[13].bOn","command_off_symbol":".arrLampCommands[13].bOff","state_symbol":".arrLampProcessOutputData[13].bData","pulse_ms":200},{"id":"allun_kattovalo","name":"Allun MH kattovalo","room":"allun_mh","command_on_symbol":".arrLampCommands[14].bOn","command_off_symbol":".arrLampCommands[14].bOff","state_symbol":".arrLampProcessOutputData[14].bData","pulse_ms":200},{"id":"emman_spotit","name":"Emman MH spotit","room":"emman_mh","command_on_symbol":".arrLampCommands[15].bOn","command_off_symbol":".arrLampCommands[15].bOff","state_symbol":".arrLampProcessOutputData[15].bData","pulse_ms":200},{"id":"emman_kattovalo","name":"Emman MH kattovalo","room":"emman_mh","command_on_symbol":".arrLampCommands[16].bOn","command_off_symbol":".arrLampCommands[16].bOff","state_symbol":".arrLampProcessOutputData[16].bData","pulse_ms":200},{"id":"wc_lt_kattovalo","name":"WC L&T kattovalo","room":"wc_lt","command_on_symbol":".arrLampCommands[35].bOn","command_off_symbol":".arrLampCommands[35].bOff","state_symbol":".arrLampProcessOutputData[35].bData","pulse_ms":200},{"id":"wc_lt_allasvalo","name":"WC L&T allasvalo","room":"wc_lt","command_on_symbol":".arrLampCommands[36].bOn","command_off_symbol":".arrLampCommands[36].bOff","state_symbol":".arrLampProcessOutputData[36].bData","pulse_ms":200},{"id":"wc_lasten_kattovalo","name":"WC lasten kattovalo","room":"wc_lasten","command_on_symbol":".arrLampCommands[38].bOn","command_off_symbol":".arrLampCommands[38].bOff","state_symbol":".arrLampProcessOutputData[38].bData","pulse_ms":200},{"id":"wc_lasten_allasvalo","name":"WC lasten allasvalo","room":"wc_lasten","command_on_symbol":".arrLampCommands[39].bOn","command_off_symbol":".arrLampCommands[39].bOff","state_symbol":".arrLampProcessOutputData[39].bData","pulse_ms":200}]

  rooms_json: >-
    [{"id":"olohuone","name":"Olohuone valot päällä","lights":["oh_kulku_spotit","oh_pihan_puolen_valot","oh_terassin_puolen_valot","oh_keskivalo","oh_epasuora_pihanseina","oh_epasuora_paatyseina","oh_epasuora_terassinseina","oh_porrasaukko_valo"]},{"id":"keittio","name":"Keittiö valot päällä","lights":["keittio_valitila_valo","keittio_valo","ruokatila_valo","keittio_ruokatila_kaytava"]},{"id":"lt_mh","name":"L&T MH valot päällä","lights":["lt_vaatehuonevalot","lt_spotit","lt_epasuora_valo"]},{"id":"allun_mh","name":"Allun MH valot päällä","lights":["allun_spotit","allun_kattovalo"]},{"id":"emman_mh","name":"Emman MH valot päällä","lights":["emman_spotit","emman_kattovalo"]},{"id":"wc_lt","name":"WC L&T valot päällä","lights":["wc_lt_kattovalo","wc_lt_allasvalo"]},{"id":"wc_lasten","name":"WC lasten valot päällä","lights":["wc_lasten_kattovalo","wc_lasten_allasvalo"]}]

  scan_hvac_states: false
  scan_start_index: 0
  scan_end_index: 31
  log_level: "INFO"

schema:
  plc_ip: str
  plc_ams_net_id: str
  local_ams_net_id: str
  plc_ads_port: int(1,65535)
  poll_interval: int(1,3600)
  light_poll_interval: int(1,60)
  reconnect_delay: int(5,3600)
  publish_heartbeat: int(30,86400)
  add_local_route: bool
  sensors_json: str
  lights_json: str
  rooms_json: str
  scan_hvac_states: bool
  scan_start_index: int(0,999)
  scan_end_index: int(0,999)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
