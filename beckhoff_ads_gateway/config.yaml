name: "Beckhoff ADS Gateway"
version: "1.3.1"
slug: "beckhoff_ads_gateway"
description: "Read-only TwinCAT 2 / TcBA multi-sensor gateway for Home Assistant using ADS and MQTT Discovery."
url: "https://github.com/timojtuominen-ai/homeassistant-floorplan"
startup: application
boot: auto
init: false
stage: experimental
arch:
  - aarch64
host_network: true
services:
  - mqtt:need

options:
  plc_ip: "192.168.1.5"
  plc_ams_net_id: "5.14.33.10.1.1"
  local_ams_net_id: "192.168.1.57.1.1"
  plc_ads_port: 801
  poll_interval: 30
  reconnect_delay: 30
  publish_heartbeat: 600
  add_local_route: true

  sensors_json: >-
    [{"id":"olohuone_lampotila","name":"Olohuone lämpötila","symbol":".arrHVACStates[4].lrActualValue","type":"LREAL","unit":"°C","device_class":"temperature","state_class":"measurement","precision":1},{"id":"keittio_lampotila","name":"Keittiö lämpötila","symbol":".arrHVACStates[7].lrActualValue","type":"LREAL","unit":"°C","device_class":"temperature","state_class":"measurement","precision":1},{"id":"lt_mh_lampotila","name":"L&T MH lämpötila","symbol":".arrHVACStates[5].lrActualValue","type":"LREAL","unit":"°C","device_class":"temperature","state_class":"measurement","precision":1},{"id":"allun_mh_lampotila","name":"Allun MH lämpötila","symbol":".arrHVACStates[2].lrActualValue","type":"LREAL","unit":"°C","device_class":"temperature","state_class":"measurement","precision":1},{"id":"emman_mh_lampotila","name":"Emman MH lämpötila","symbol":".arrHVACStates[3].lrActualValue","type":"LREAL","unit":"°C","device_class":"temperature","state_class":"measurement","precision":1}]

  lights_json: >-
    [{"id":"oh_keskivalo","name":"OH keskivalo","command_on_symbol":".arrLampCommands[23].bOn","command_off_symbol":".arrLampCommands[23].bOff","state_symbol":".arrLampProcessOutputData[23].bData","state_ads_port":27908,"state_index_group":"0x13003","state_index_offset":"0x25B","pulse_ms":200}]

  scan_hvac_states: false
  scan_start_index: 0
  scan_end_index: 31
  log_level: "INFO"

schema:
  plc_ip: str
  plc_ams_net_id: str
  local_ams_net_id: str
  plc_ads_port: int(1,65535)
  poll_interval: int(1,3600)
  reconnect_delay: int(5,3600)
  publish_heartbeat: int(30,86400)
  add_local_route: bool
  sensors_json: str
  lights_json: str
  scan_hvac_states: bool
  scan_start_index: int(0,999)
  scan_end_index: int(0,999)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
