name: "Beckhoff ADS Gateway"
version: "1.0.1"
slug: "beckhoff_ads_gateway"
description: "Read-only TwinCAT 2 / TcBA gateway for Home Assistant using ADS and MQTT Discovery."
url: "https://github.com/timojtuominen-ai/homeassistant-floorplan"
startup: application
boot: auto
init: false
stage: experimental
arch:
  - aarch64
host_network: true
services:
  - mqtt:need

options:
  plc_ip: "192.168.1.5"
  plc_ams_net_id: "5.14.33.10.1.1"
  local_ams_net_id: "192.168.1.57.1.1"
  plc_ads_port: 801

  poll_interval: 30
  reconnect_delay: 30
  publish_heartbeat: 600
  add_local_route: true

  read_mode: "symbol"
  symbol: ".arrHVACStates[4].lrActualValue"
  symbol_data_type: "LREAL"

  fallback_direct_read: true
  index_group: "0x4040"
  index_offset: "0x126270"
  direct_data_type: "LREAL"
  scale: 1.0
  offset_adjustment: 0.0
  precision: 1

  entity_name: "Olohuone lämpötila"
  entity_id: "olohuone_lampotila"
  unit_of_measurement: "°C"
  device_class: "temperature"
  state_class: "measurement"

  log_level: "INFO"

schema:
  plc_ip: str
  plc_ams_net_id: str
  local_ams_net_id: str
  plc_ads_port: int(1,65535)

  poll_interval: int(1,3600)
  reconnect_delay: int(5,3600)
  publish_heartbeat: int(30,86400)
  add_local_route: bool

  read_mode: list(symbol|direct)
  symbol: str
  symbol_data_type: list(BOOL|BYTE|WORD|DWORD|INT|UINT|DINT|UDINT|REAL|LREAL)

  fallback_direct_read: bool
  index_group: str
  index_offset: str
  direct_data_type: list(BOOL|BYTE|WORD|DWORD|INT|UINT|DINT|UDINT|REAL|LREAL)
  scale: float
  offset_adjustment: float
  precision: int(0,6)

  entity_name: str
  entity_id: match(^[a-z0-9_]+$)
  unit_of_measurement: str
  device_class: str
  state_class: str

  log_level: list(DEBUG|INFO|WARNING|ERROR)
