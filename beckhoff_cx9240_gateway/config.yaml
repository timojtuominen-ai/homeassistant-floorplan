name: "Beckhoff CX9240 Gateway"
version: "1.0.11"
slug: "beckhoff_cx9240_gateway"
description: "Production TwinCAT 3 / CX9240 ADS <-> MQTT gateway for Kotiautomaatio_TC3 v0.33.2 with physical fire-bell inhibit, independent moisture detectors, yard-light state, hot-tub control, Service diagnostics and heating controls"
url: "https://github.com/timojtuominen-ai/homeassistant-floorplan"
startup: application
boot: auto
init: false
stage: stable
arch:
  - aarch64
host_network: true
services:
  - mqtt:need

options:
  # Documentation-only TEST-NET defaults. Existing add-on options are retained
  # during an upgrade; new installations must enter their own PLC/AMS values.
  plc_ip: "192.0.2.10"
  plc_ams_net_id: "192.0.2.10.1.1"
  local_ams_net_id: "192.0.2.20.1.1"
  plc_ads_port: 851
  poll_interval: 1.0
  reconnect_delay: 5
  command_pulse_ms: 200
  publish_discovery: true
  log_level: "INFO"

schema:
  plc_ip: str
  plc_ams_net_id: str
  local_ams_net_id: str
  plc_ads_port: int(1,65535)
  poll_interval: float(0.2,60)
  reconnect_delay: int(1,300)
  command_pulse_ms: int(50,2000)
  publish_discovery: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)
